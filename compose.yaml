services:
  db:
    image: docker.io/library/mariadb:10.11
    container_name: nextcloud-db
    restart: always
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    volumes:
      - db_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_clave_segura}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-nextcloud_clave_segura}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-nextcloud}
      - MYSQL_USER=${MYSQL_USER:-nextcloud}

  app:
    image: docker.io/library/nextcloud:latest
    container_name: nextcloud-app
    restart: always
    ports:
      - "80:80"
    depends_on:
      - db
    volumes:
      - nextcloud_data:/var/www/html
    environment:
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-nextcloud_clave_segura}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-nextcloud}
      - MYSQL_USER=${MYSQL_USER:-nextcloud}
      - MYSQL_HOST=db
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_TRUSTED_DOMAINS:-thedeadlocks.duckdns.org 98.81.173.42}

volumes:
  db_data:
  nextcloud_data:
